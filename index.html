<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome My Mental Munda 💖</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <!-- Background Animated Hearts Container -->
  <div id="floating-hearts-bg"></div>

  <!-- Main Login Card Container -->
  <main class="container" style="max-width: 460px; z-index: 10;">
    <div class="glass-card p-4 p-sm-5 text-center position-relative animated-float" id="login-card">
      
      <!-- Top Decorative Animated Icon -->
      <div class="mb-3">
        <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle shadow-sm" style="width: 80px; height: 80px;">
          <span class="heart-pulse fs-1">💖</span>
        </div>
      </div>

      <!-- Heading -->
      <h2 class="serif-font fw-bold mb-1" style="color: #ff3366;">Secret Love Portal</h2>
      <p class="text-muted small mb-4">
        A private universe created just for <span class="fw-semibold text-danger">Mental Munda</span> by <span class="fw-semibold text-primary">Nani Bava</span>
      </p>

      <!-- Alert / Feedback Area -->
      <div id="alert-container" class="mb-3"></div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="off" novalidate>
        
        <!-- Username Field -->
        <div class="input-icon-wrapper mb-3 text-start">
          <i class="bi bi-person-heart input-icon"></i>
          <div class="form-floating">
            <input 
              type="text" 
              class="form-control" 
              id="username" 
              placeholder="Mental Munda" 
              required
              autofocus
            >
            <label for="username" style="padding-left: 3rem; color: #8e839e;">Your Nickname (Username)</label>
          </div>
        </div>

        <!-- Password Field -->
        <div class="input-icon-wrapper mb-3 text-start">
          <i class="bi bi-key-fill input-icon"></i>
          <div class="form-floating">
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              placeholder="Nani Bava" 
              required
            >
            <label for="password" style="padding-left: 3rem; color: #8e839e;">Secret Key (Password)</label>
          </div>
          <button 
            type="button" 
            class="password-toggle-btn" 
            id="toggle-password" 
            aria-label="Toggle password visibility"
            title="Show/Hide Password"
          >
            <i class="bi bi-eye" id="password-toggle-icon"></i>
          </button>
        </div>

        <!-- Submit Button -->
        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-romantic py-3 fs-6" id="login-btn">
            Unlock My Heart <i class="bi bi-arrow-right-heart-fill ms-1"></i>
          </button>
        </div>
      </form>

      <!-- Sweet Clue / Hint Collapse -->
      <div class="mt-4 pt-2 border-top border-light-subtle">
        <a class="text-decoration-none small text-muted d-inline-flex align-items-center gap-1" data-bs-toggle="collapse" href="#hintCollapse" role="button" aria-expanded="false" aria-controls="hintCollapse">
          <span>Need a hint, sweetie?</span> <i class="bi bi-question-circle"></i>
        </a>
        <div class="collapse mt-2" id="hintCollapse">
          <div class="hint-badge text-start">
            <div><i class="bi bi-sparkles me-1 text-warning"></i> <strong>Username:</strong> <code>Mental Munda</code></div>
            <div><i class="bi bi-heart-fill me-1 text-danger"></i> <strong>Password:</strong> <code>Nani Bava</code></div>
            <div class="text-muted small mt-1">Hint: The cutest girl + the guy who loves her most! 💕</div>
          </div>
        </div>
      </div>

      <!-- Footer Tag -->
      <div class="mt-4 text-muted small">
        <span>Hand-crafted with infinite ❤️ by your Nani Bava</span>
      </div>

    </div>
  </main>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Custom Login Script -->
  <script src="login.js"></script>
</body>
</html>
